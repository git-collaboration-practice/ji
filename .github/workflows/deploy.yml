
name: Deploy Static Site

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 다운로드
      - name: Checkout
        uses: actions/checkout@v4

      # 2. SSH 인증 준비
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      # 3. 정적 웹사이트 전송
      - name: Deploy via rsync
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes" \
            site/ \
            "$REMOTE_USER@$REMOTE_HOST:/home/ubuntu/www/"

      # 4. Nginx 재시작
      - name: Restart nginx
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            "$REMOTE_USER@$REMOTE_HOST" \
            "sudo -n nginx -t && sudo -n systemctl restart nginx && curl -fsSI http://127.0.0.1/"
