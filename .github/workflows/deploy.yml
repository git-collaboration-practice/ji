

name: Vanilla Web Server Continuous Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actions 실행 환경에 소스코드 다운로드
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. SSH로 카카오클라우드 Ubuntu 서버에 접속
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          # 3. 원격 서버에서 실행할 배포 스크립트
          script: |
            set -e

            echo "=== 배포 시작 ==="

            # 프로젝트 디렉터리 생성
            mkdir -p ~/creativity
            mkdir -p /home/ubuntu/www

            # GitHub 정적 웹사이트 소스코드 다운로드
            if [ -d ~/creativity/.git ]; then
              echo "=== 기존 GitHub 저장소 업데이트 ==="
              cd ~/creativity
              git pull --ff-only
            else
              echo "=== GitHub 저장소 Clone ==="
              git clone https://github.com/s3458600-ui/creativity.git ~/creativity
            fi

            # 웹사이트 파일 확인
            cd ~/creativity
            test -f index.html

            # 최신 웹사이트 파일 배포
            echo "=== 웹사이트 파일 배포 ==="
            rsync -av --delete \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '.gitignore' \
              --exclude 'README.md' \
              ~/creativity/ /home/ubuntu/www/

            # Nginx 설정 검사 및 재시작
            echo "=== Nginx 재시작 ==="
            sudo -n nginx -t
            sudo -n systemctl restart nginx

            # 배포된 파일 확인
            echo "=== 배포 파일 확인 ==="
            ls -la /home/ubuntu/www

            # 웹서버 응답 확인
            echo "=== 웹서버 상태 확인 ==="
            curl -fsSI http://127.0.0.1/

            echo "=== 원격 서버 배포 성공 완료! ==="
            uptime
