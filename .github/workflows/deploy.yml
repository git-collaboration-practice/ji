


name: Deploy Todo App (Web & WAS)

on:
  push:
    branches: -feature/web-was
  workflow_dispatch:

jobs:
  # =========================================
  # 1. WEB 서버 배포 (SCP)
  # =========================================
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Delivery HTML to Web Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_SERVER_HOST }}
          username: ${{ secrets.WEB_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          source: "web/index.html"
          target: "/var/www/html"
          strip_components: 1
          overwrite: true

  # =========================================
  # 2. WAS 서버 배포 (SSH)
  # =========================================
  deploy-was:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Git Pull & Restart Flask
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WAS_SERVER_HOST }}
          username: ${{ secrets.WAS_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "=== WAS 배포 시작 ==="

            # 최초 배포 시 저장소 Clone
            if [ ! -d /home/ubuntu/todo-app/.git ]; then
              git clone -b main \
                https://github.com/git-collaboration-practice/ji.git \
                /home/ubuntu/todo-app
            fi

            # 최신 GitHub 소스코드 가져오기
            cd /home/ubuntu/todo-app

            git fetch origin main
            git reset --hard origin/main

            # Flask 프로젝트 이동
            cd was

            # Python 가상환경 생성
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi

            # Python 패키지 설치
            .venv/bin/python -m pip install \
              -r requirements.txt

            # Flask 서비스 재시작
            echo "=== Flask 재시작 ==="
            sudo -n systemctl restart todo-was
            sudo -n systemctl is-active --quiet todo-was

            # API 상태 확인
            echo "=== WAS 상태 확인 ==="
            curl --retry 5 \
              --retry-delay 1 \
              --retry-connrefused \
              -fsS http://127.0.0.1:5000/api/todos

            echo "=== WAS 배포 완료 ==="
            uptime
