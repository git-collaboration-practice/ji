
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>2-Tier Todo App</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h2 { text-align: center; }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-box input {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .add-btn {
            background: #007bff;
            color: white;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        #message {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h2>📝 Todo App (2-Tier)</h2>

    <div class="input-box">
        <input
            type="text"
            id="todo-input"
            placeholder="새로운 할 일 입력..."
        >
        <button class="add-btn" onclick="addTodo()">
            추가
        </button>
    </div>

    <div id="todo-list"></div>
    <p id="message"></p>

    <script>
        const WAS_API_URL = "/api/todos";

        // 1. Todo 목록 조회
        async function loadTodos() {
            try {
                const response = await fetch(WAS_API_URL);
                if (!response.ok) {
                    throw new Error("조회 실패");
                }

                const todos = await response.json();
                const list =
                    document.getElementById("todo-list");

                list.replaceChildren();

                todos.forEach(todo => {
                    const div =
                        document.createElement("div");
                    div.className = "todo-item";

                    const span =
                        document.createElement("span");
                    span.textContent = todo.title;

                    const button =
                        document.createElement("button");
                    button.className = "delete-btn";
                    button.textContent = "삭제";
                    button.onclick = () =>
                        deleteTodo(todo.id);

                    div.append(span, button);
                    list.appendChild(div);
                });

                document.getElementById("message")
                    .textContent = "";
            } catch (error) {
                document.getElementById("message")
                    .textContent = "서버 연결 실패";
                console.error(error);
            }
        }

        // 2. Todo 추가
        async function addTodo() {
            const input =
                document.getElementById("todo-input");
            const title = input.value.trim();

            if (!title) return;

            try {
                const response = await fetch(WAS_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ title })
                });

                if (!response.ok) {
                    throw new Error("추가 실패");
                }

                input.value = "";
                await loadTodos();
            } catch (error) {
                alert("할 일 추가 실패");
                console.error(error);
            }
        }

        // 3. Todo 삭제
        async function deleteTodo(id) {
            try {
                const response = await fetch(
                    `${WAS_API_URL}/${id}`,
                    { method: "DELETE" }
                );

                if (!response.ok) {
                    throw new Error("삭제 실패");
                }

                await loadTodos();
            } catch (error) {
                alert("할 일 삭제 실패");
                console.error(error);
            }
        }

        window.onload = loadTodos;
    </script>
</body>
</html>
